<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>jQuery</title>

    <script
      src="https://code.jquery.com/jquery-3.7.1.slim.min.js"
      integrity="sha256-t5Q8fN0C4D0yD1R5MMEZe2qVD/3GJ8ffNk5D7YBvC2E="
      crossorigin="anonymous"
    ></script>

    <script type="application/javascript">
      function createFamilyTree() {
        $('body').append(
          $('<table>').append(
            $('<thead>').append(
              $('<tr>').append(
                $('<th>').text('Firstname'),
                $('<th>').text('Lastname'),
              ),
            ),
            $('<tbody>'),
          ),
        );
      }

      function addNewMember(firstName, lastName, position) {
        const row = $('<tr>').append(
          $('<td>').text(firstName),
          $('<td>').text(lastName),
          $('<td>')
            .text('(x)')
            .css('background-color', 'orange')
            .on('click', function () {
              $(this).parent().remove();
            }),
        );

        if (position === 'before') {
          $('tbody').prepend(row);
        } else {
          $('tbody').append(row);
        }
      }

      function createForm() {
        const form = $('<form>');

        form.append(
          $('<input>').attr('type', 'text'),
          $('<input>').attr('type', 'text'),
          $('<select>').append(
            $('<option>').val('before').text('Before'),
            $('<option>').val('after').text('After'),
          ),
          $('<input>').attr({ type: 'submit', value: 'Add member' }),
        );

        $('table').first().before(form);

        form.on('submit', function (event) {
          event.preventDefault();

          const firstName = $("input[type='text']").first().val();
          const lastName = $("input[type='text']:nth-of-type(2)").val();
          const position = $('select').val();

          addNewMember(firstName, lastName, position);
        });
      }

      createFamilyTree();
      createForm();
    </script>
  </head>
  <body></body>
</html>
