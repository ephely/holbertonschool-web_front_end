<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>jQuery</title>

    <script
      src="https://code.jquery.com/jquery-3.7.1.slim.min.js"
      integrity="sha256-t5Q8fN0C4D0yD1R5MMEZe2qVD/3GJ8ffNk5D7YBvC2E="
      crossorigin="anonymous"
    ></script>

    <script type="application/javascript">
      function createFamilyTree() {
        $('body').append(
          $('<table>').append(
            $('<thead>').append(
              $('<tr>').append(
                $('<th>').text('Firstname'),
                $('<th>').text('Lastname'),
              ),
            ),
            $('<tbody>').append(
              $('<tr>').append(
                $('<td>').text('Guillaume'),
                $('<td>').text('Salva'),
              ),
              $('<tr>').append(
                $('<td>').text('Paulette'),
                $('<td>').text('Salva'),
              ),
              $('<tr>').append(
                $('<td>').text('Antoine'),
                $('<td>').text('Salva'),
              ),
            ),
          ),
        );
      }

      function replaceFamilyTree() {
        $('tbody').html('<tr><td>Gerard</td><td>Bonissa</td></tr>');
      }

      createFamilyTree();
      replaceFamilyTree();
    </script>
  </head>
  <body></body>
</html>
